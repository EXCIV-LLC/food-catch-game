<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Catch Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
      <div>Score: <span id="scoreText">0</span></div>
      <div>Best: <span id="bestScoreText">0</span></div>
      <div>Life: <span id="lifeText">3</span></div>
    </div>

    <div id="message">
      <img class="title-logo" src="assets/logo.svg" alt="Food Catch!" />
      <img class="title-character" src="assets/mascot.svg" alt="カゴのキャラクター" />
      <p class="title-best">Best: <span id="titleBestScoreText">0</span></p>
      <p>落ちてくる食べ物をキャッチしよう！</p>
      <button id="startButton">START</button>
      <div class="ad-placeholder" aria-label="広告枠">
        <span>AD SPACE</span>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
