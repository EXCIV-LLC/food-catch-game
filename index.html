<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Food Catch Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(#bdefff, #fff7d6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameWrap {
      position: relative;
      width: min(100vw, 480px);
      height: min(100vh, 800px);
      background: linear-gradient(#bdefff 0%, #e8f9ff 55%, #fff1b8 100%);
      overflow: hidden;
      border: 4px solid #333;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      color: #333;
      font-weight: 800;
      font-size: 20px;
      text-shadow: 0 2px 0 rgba(255,255,255,0.7);
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.76);
      color: #333;
      text-align: center;
      padding: 24px;
    }

    #message.hidden {
      display: none;
    }

    #message h1 {
      font-size: 34px;
    }

    #message p {
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      border: none;
      border-radius: 999px;
      background: #ff9f1c;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      padding: 14px 28px;
      box-shadow: 0 5px 0 #c96c00;
      cursor: pointer;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #c96c00;
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
      <div>Score: <span id="scoreText">0</span></div>
      <div>Life: <span id="lifeText">3</span></div>
    </div>

    <div id="message">
      <h1>Food Catch!</h1>
      <p>左右キー、または画面をドラッグして<br>落ちてくる食べ物をキャッチしよう！</p>
      <button id="startButton">START</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gameWrap = document.getElementById("gameWrap");
    const scoreText = document.getElementById("scoreText");
    const lifeText = document.getElementById("lifeText");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    let width = 0;
    let height = 0;

    let score = 0;
    let life = 3;
    let isPlaying = false;
    let lastTime = 0;
    let spawnTimer = 0;

    const keys = {
      left: false,
      right: false,
    };

    const player = {
      x: 0,
      y: 0,
      width: 90,
      height: 42,
      speed: 420,
    };

    const foods = [];
    const foodTypes = ["🍎", "🍙", "🍔", "🍓", "🥕", "🍩"];

    function resizeCanvas() {
      const rect = gameWrap.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      width = rect.width;
      height = rect.height;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      player.y = height - 80;
      player.x = Math.min(Math.max(player.x, player.width / 2), width - player.width / 2);
    }

    function resetGame() {
      score = 0;
      life = 3;
      foods.length = 0;
      spawnTimer = 0;
      player.x = width / 2;
      updateUI();
    }

    function startGame() {
      resetGame();
      isPlaying = true;
      lastTime = performance.now();
      message.classList.add("hidden");
      requestAnimationFrame(gameLoop);
    }

    function endGame() {
      isPlaying = false;
      message.classList.remove("hidden");
      message.innerHTML = `
        <h1>Game Over</h1>
        <p>Score: ${score}</p>
        <button id="restartButton">RETRY</button>
      `;
      document.getElementById("restartButton").addEventListener("click", startGame);
    }

    function updateUI() {
      scoreText.textContent = score;
      lifeText.textContent = life;
    }

    function spawnFood() {
      const size = 38 + Math.random() * 12;
      foods.push({
        x: 30 + Math.random() * (width - 60),
        y: -40,
        size,
        speed: 160 + Math.random() * 120 + score * 2,
        icon: foodTypes[Math.floor(Math.random() * foodTypes.length)],
      });
    }

    function update(deltaTime) {
      if (keys.left) player.x -= player.speed * deltaTime;
      if (keys.right) player.x += player.speed * deltaTime;

      player.x = Math.max(player.width / 2, Math.min(width - player.width / 2, player.x));

      spawnTimer += deltaTime;
      const spawnInterval = Math.max(0.45, 1.0 - score * 0.01);
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnFood();
      }

      for (let i = foods.length - 1; i >= 0; i--) {
        const food = foods[i];
        food.y += food.speed * deltaTime;

        const hitX = Math.abs(food.x - player.x) < player.width / 2 + food.size / 2;
        const hitY = Math.abs(food.y - player.y) < player.height / 2 + food.size / 2;

        if (hitX && hitY) {
          foods.splice(i, 1);
          score += 10;
          updateUI();
          continue;
        }

        if (food.y > height + 50) {
          foods.splice(i, 1);
          life -= 1;
          updateUI();
          if (life <= 0) {
            endGame();
            return;
          }
        }
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, width, height);

      ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
      drawCloud(80, 100, 36);
      drawCloud(width - 90, 180, 30);

      ctx.fillStyle = "rgba(255, 210, 80, 0.55)";
      ctx.beginPath();
      ctx.arc(width - 70, 80, 36, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCloud(x, y, r) {
      ctx.beginPath();
      ctx.arc(x - r * 0.7, y, r * 0.65, 0, Math.PI * 2);
      ctx.arc(x, y - r * 0.2, r, 0, Math.PI * 2);
      ctx.arc(x + r * 0.8, y, r * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);

      ctx.fillStyle = "#8b5a2b";
      roundRect(-player.width / 2, -player.height / 2, player.width, player.height, 18);
      ctx.fill();

      ctx.fillStyle = "#f5c16c";
      roundRect(-player.width / 2 + 8, -player.height / 2 + 8, player.width - 16, player.height - 16, 14);
      ctx.fill();

      ctx.font = "24px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🧺", 0, -2);

      ctx.restore();
    }

    function drawFoods() {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const food of foods) {
        ctx.font = `${food.size}px sans-serif`;
        ctx.fillText(food.icon, food.x, food.y);
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function draw() {
      drawBackground();
      drawFoods();
      drawPlayer();
    }

    function gameLoop(currentTime) {
      if (!isPlaying) return;

      const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.033);
      lastTime = currentTime;

      update(deltaTime);
      draw();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    });

    gameWrap.addEventListener("pointermove", (e) => {
      if (!isPlaying) return;
      const rect = gameWrap.getBoundingClientRect();
      player.x = e.clientX - rect.left;
    });

    startButton.addEventListener("click", startGame);

    resizeCanvas();
    draw();
  </script>
</body>
</html>
